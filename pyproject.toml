[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-switch"
version = "0.1.0"
description = "Explicitly toggle system-level AI features on Linux"
requires-python = ">=3.9"
readme = "README.md"

[project.scripts]
ai-switch = "ai_switch.cli:main"

[tool.setuptools]
packages = ["ai_switch", "ai_switch.actions", "ai_switch.modules"]

[tool.setuptools.package-data]
ai_switch = ["data/*.txt"]
